<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="support.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href = "panel.html"><img src="tiger.png" alt="Server Logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="night.html"><span>🏠 Home</span></a></li>
                <li><a href="news.html"><span>📢 News</span></a></li>
                <li><a href="list.html"><span>📚 Member list</span></a></li>
                <li><a href="support.html"><span>🎟️ Support</span></a></li>
            </ul>
            <div class="discord-link">
                <a href="discord.html">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                </a>
            </div>
            
            <div class="login-button">
                <a href="#"><span>Logout</span></a>
            </div>
        </nav>
    </header>
    <main>
        
    <div class="ticket-panel">
        <h1>SUPPORT TICKET</h1>
        
        <form id="supportForm" action="mailto:your-email@example.com" method="post" enctype="text/plain">
            <div class="form-group">
                <label for="name">Your Username</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required>
            </div>
            
            <div class="option-group">
                <div class="option">
                    <input type="radio" id="question" name="ticketType" value="Question" checked>
                    <label for="question">Question</label>
                </div>
                <div class="option">
                    <input type="radio" id="issue" name="ticketType" value="Issue">
                    <label for="issue">Issue</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">SUBMIT TICKET</button>
        </form>
    </div>
    </main>
</body>
</html>
