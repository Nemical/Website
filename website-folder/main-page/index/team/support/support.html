<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team</title>
    <link rel="stylesheet" href="/main.css" />
    <link rel="stylesheet" href="/components/navbar/navbar.css" />
    <link rel="stylesheet" href="/components/modal/modal.css" />
    <link rel="stylesheet" href="/main-page/index/team/support/support.css" />
</head>
<body>
    <header>
        <nav id="navbar">
            </div>
        </nav>
    </header>

    <main>
        <div class="ticket-panel">
            <div class="ticket-header">Support Ticket</div>
            <form class="ticket-form">
                <label for="ticket-title">Title</label>
                <input type="text" id="ticket-title" name="ticket-title" required />

                <label for="ticket-desc">Description</label>
                <textarea id="ticket-desc" name="ticket-desc" rows="5" required></textarea>

                <button type="submit" class="ticket-submit-btn">Submit</button>
            </form>
        </div>
    </main>

    <script src="/main.js"></script>
    <script src="/components/navbar/navbar.js"></script>   
    <script src="/components/modal/modal.js"></script>
    <script src="/main-page/index/team/support/support.js"></script>
</body>
</html>
