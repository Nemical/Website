<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div class="modal-tabs">
      <button class="modal-tab active" id="login-tab" data-modal="login">Login</button>
      <button class="modal-tab" id="register-tab" data-modal="register">Register</button>
    </div>
    <form id="login-form" class="modal-form">
      <h2>Login</h2>
      <label>
        Username
        <input type="text" name="login-username" required />
      </label>
      <label>
        Email
        <input type="email" name="login-email" required />
      </label>
      <label>
        Password
        <input type="password" name="login-password" required />
      </label>
      <label>
        2FA Code
        <input type="text" name="login-2fa" />
      </label>
      <button type="submit" class="modal-action-btn">Login</button>
    </form>
    
    <form id="register-form" class="modal-form" style="display:none;">
      <h2>Register</h2>
      <label>
        Username
        <input type="text" name="register-username" required />
      </label>
      <label>
        Email
        <input type="email" name="register-email" required />
      </label>
      <label>
        Password
        <input type="password" name="register-password" required />
      </label>
      <label>
        Confirm Password
        <input type="password" name="register-confirm" required />
      </label>
      <label>
        Invite Code
        <input type="text" name="register-invite" />
      </label>
      <button type="submit" class="modal-action-btn">Register</button>
    </form>
  </div>
</div>
